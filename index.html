const d=new THREE.Vector3();cam.getWorldDirection(d);
if(wp.id!=='awp'||!wp.sc){d.x+=(Math.random()-.5)*.016;d.y+=(Math.random()-.5)*.016}d.normalize();
rc.set(cam.getWorldPosition(new THREE.Vector3()),d);
const tg=[...en,...al].map(b=>b.mesh);const ht=rc.intersectObjects(tg,true);
if(ht.length){
let o=ht[0].object;while(o.parent&&![...en,...al].find(b=>b.mesh===o))o=o.parent;
const b=[...en,...al].find(b=>b.mesh===o);
if(b&&b.tm!==pl.tm){b.hp-=wp.d;sfxH();o.traverse(c=>{if(c.isMesh&&c.material?.emissive){const ol=c.material.emissive.getHex();c.material.emissive.setHex(0xff3333);setTimeout(()=>{if(c.material)c.material.emissive.setHex(ol)},50)}});if(b.hp<=0)kill(b)}
}
if(!wp.au)fir=0;
}

function kill(b){sfxD();sc.remove(b.mesh);if(b.ally)al=al.filter(x=>x!==b);else{en=en.filter(x=>x!==b);kl++;pl.mon+=300}hud();show(b.tm==='CT'?'+1 Спецназ':'+1 Террорист',600);if(!en.length&&!bm.p)endR('CT')}

function reload(){
if(wp.rl||wp.am===wp.mg||wp.rs<=0||ft>0)return;wp.rl=1;sfxR();show('Перезарядка...',800);
setTimeout(()=>{const n=wp.mg-wp.am;const t=Math.min(n,wp.rs);wp.am+=t;wp.rs-=t;wp.rl=0;hud()},wp.id==='awp'?2300:1500);
}

const sA=new THREE.Vector3(-10,0,4),sB=new THREE.Vector3(28,0,2);

function plantDef(dt){
const p=MOB?cam.position:ctl.getObject().position;
const nA=p.distanceTo(sA)<3.5,nB=p.distanceTo(sB)<3.5,nBm=bm.p&&bm.m&&p.distanceTo(bm.m.position)<2.3;
if(pl.tm==='T'&&!bm.p&&(nA||nB)&&pln){bm.pp+=dt;bst.style.display='block';bst.textContent=`Закладка... ${Math.min(100,bm.pp/C.plant*100|0)}%`;if(bm.pp>=C.plant)doPlant(nA?'A':'B',p)}
else if(pl.tm==='CT'&&bm.p&&nBm&&def){bm.dp+=dt;bst.style.display='block';bst.textContent=`Обезвреживание... ${Math.min(100,bm.dp/C.defuse*100|0)}%`;if(bm.dp>=C.defuse)doDef()}
else{if(!pln&&!def){bm.pp=0;bm.dp=0;if(!bm.p)bst.style.display='none'}}
if(MOB){const sh=(pl.tm==='T'&&!bm.p&&(nA||nB))||(pl.tm==='CT'&&bm.p&&nBm);bp.style.display=sh?'flex':'none'}
}

function doPlant(s,p){bm.p=1;bm.s=s;bm.t=C.bombT;bm.pp=0;pln=0;sfxP();show(`Бомба на ${s}!`,1600);bst.style.display='block';bst.textContent=`Бомба на ${s}`;tmr.classList.add('b');bm.m=new THREE.Mesh(new THREE.BoxGeometry(.5,.28,.32),new THREE.MeshStandardMaterial({color:0x222,metalness:.6}));bm.m.position.set(p.x,.18,p.z);sc.add(bm.m)}
function doDef(){bm.p=0;bm.dp=0;def=0;if(bm.m){sc.remove(bm.m);bm.m=null}sfxDf();show('Бомба обезврежена!',2000);bst.style.display='none';tmr.classList.remove('b');endR('CT')}
function updBomb(dt){if(!bm.p)return;bm.t-=dt;if(Math.floor(bm.t)!==Math.floor(bm.t+dt))sfxB();if(bm.t<=0){show('Бомба взорвалась!',2000);endR('T')}}

function canGo(x,z){const t=new THREE.Box3(new THREE.Vector3(x-.32,.3,z-.32),new THREE.Vector3(x+.32,1.6,z+.32));for(const w of wl)if(t.intersectsBox(w.b))return 0;return 1}

function updBots(dt){
const pp=MOB?cam.position:ctl.getObject().position;
for(const b of[...en,...al]){
const ep=b.mesh.position;let tp;
if(b.ally){tp=bm.p?bm.m.position.clone():(b.ts==='A'?sA:sB).clone();if(Math.random()<.2)tp=pp.clone()}
else{tp=bm.p?bm.m.position.clone():(b.ts==='A'?sA:sB).clone();if(ep.distanceTo(pp)<13)tp=pp.clone()}
const ds=ep.distanceTo(tp);const lk=tp.clone();lk.y=ep.y;b.mesh.lookAt(lk);
if(ds>1.7){
const dir=new THREE.Vector3().subVectors(tp,ep);dir.y=0;dir.normalize();
let nx=ep.x+dir.x*b.spd*dt,nz=ep.z+dir.z*b.spd*dt;
if(!canGo(nx,nz)){const L=new THREE.Vector3(-dir.z,0,dir.x),R=new THREE.Vector3(dir.z,0,-dir.x);
const tl={x:ep.x+L.x*b.spd*dt,z:ep.z+L.z*b.spd*dt},tr={x:ep.x+R.x*b.spd*dt,z:ep.z+R.z*b.spd*dt};
if(canGo(tl.x,tl.z)){nx=tl.x;nz=tl.z}else if(canGo(tr.x,tr.z)){nx=tr.x;nz=tr.z}else{nx=ep.x;nz=ep.z}}
ep.x=nx;ep.z=nz;
}else if(!b.ally&&!bm.p&&ds<2.6){if(!b.ps)b.ps=performance.now();if(performance.now()-b.ps>3000){doPlant(b.ts,ep);b.ps=null}}
if(!b.ally){const d=ep.distanceTo(pp);if(d<C.eRng+.3){const n=performance.now();if(n-b.la>C.eCd){b.la=n;pl.hp-=C.eDmg*(pl.arm>0?.65:1);if(pl.arm>0)pl.arm=Math.max(0,pl.arm-5);sfxH();hud();if(pl.hp<=0){pl.hp=0;endG()}}}}
}
}

function updPl(dt){
if(go||ro||ft>0)return;
const sp=C.spd;const p=MOB?cam.position:ctl.getObject().position;let mx=0,mz=0;
if(MOB){const y=cam.rotation.y;const fx=-Math.sin(y),fz=-Math.cos(y),rx=Math.cos(y),rz=-Math.sin(y);mx=(fx*md.z+rx*md.x)*sp;mz=(fz*md.z+rz*md.x)*sp}
else if(ctl?.isLocked){const f=+(ky.KeyW||0)-(+(ky.KeyS||0));const s=+(ky.KeyD||0)-(+(ky.KeyA||0));const y=ctl.getObject().rotation.y;const fx=-Math.sin(y),fz=-Math.cos(y),rx=Math.cos(y),rz=-Math.sin(y);mx=(fx*f+rx*s)*sp;mz=(fz*f+rz*s)*sp}
pl.vel.x=mx;pl.vel.z=mz;pl.vel.y-=C.grav*dt;
if(pl.gnd&&(ky.Space||ky.jump)){pl.vel.y=C.jmp;pl.gnd=0}
const nx=p.x+pl.vel.x*dt,nz=p.z+pl.vel.z*dt,ny=p.y+pl.vel.y*dt;
let cx=1,cz=1;
const bx=new THREE.Box3(new THREE.Vector3(nx-.38,.3,p.z-.38),new THREE.Vector3(nx+.38,1.7,p.z+.38));for(const w of wl)if(bx.intersectsBox(w.b)){cx=0;break}
const bz=new THREE.Box3(new THREE.Vector3(p.x-.38,.3,nz-.38),new THREE.Vector3(p.x+.38,1.7,nz+.38));for(const w of wl)if(bz.intersectsBox(w.b)){cz=0;break}
if(cx)p.x=nx;if(cz)p.z=nz;
if(ny<=1.7){p.y=1.7;pl.vel.y=0;pl.gnd=1}else{p.y=ny;pl.gnd=0}
p.x=THREE.MathUtils.clamp(p.x,-45,45);p.z=THREE.MathUtils.clamp(p.z,-35,48);
if(fir)shoot();
if(wp.rc>0){cam.rotation.x+=wp.rc*.18;cam.rotation.x=Math.max(-1.1,Math.min(1.1,cam.rotation.x));wp.rc*=.75}
plantDef(dt);
if((Math.abs(mx)>.4||Math.abs(mz)>.4)&&pl.gnd&&Math.random()<.02)sfxF();
}

function updRnd(dt){
if(ft>0){ft-=dt;tmr.textContent=`Заморозка ${Math.ceil(ft)}`;if(ft<=0){buy.style.display='none';show('Раунд!',1200)}return}
if(ro||go)return;
if(!bm.p){rt-=dt;const m=rt/60|0,s=rt%60|0;tmr.textContent=`${m}:${s<10?'0':''}${s}`;if(rt<=0)endR('CT')}
else tmr.textContent=`💣 ${Math.ceil(bm.t)}`;
}

function endR(w){if(ro)return;ro=1;fir=0;pln=0;def=0;show(w==='CT'?'Спецназ победил!':'Террористы победили!',2500);setTimeout(newRnd,3000)}
function newRnd(){
[...en,...al].forEach(b=>sc.remove(b.mesh));en=[];al=[];
if(bm.m){sc.remove(bm.m);bm.m=null}bm={p:0,s:null,pp:0,dp:0,t:0,m:null};tmr.classList.remove('b');bst.style.display='none';
pl.hp=100;ro=0;rt=C.rndT;ft=C.frz;
const p=MOB?cam.position:ctl.getObject().position;p.set(-6+Math.random()*3,1.7,-10);cam.rotation.set(0,.25,0);
for(let i=0;i<4;i++)bot('CT',1);for(let i=0;i<5;i++)bot('T',0);
hud();buy.style.display='flex';mv.textContent=pl.mon;
}
function endG(){go=1;fir=0;if(ctl?.isLocked)ctl.unlock();ov.style.display='flex';ov.innerHTML=`<h1 style="color:#e74c3c">ТЫ УБИТ</h1><p>Убийств: <b>${kl}</b></p><button class="st" id="rs">ЕЩЁ РАЗ</button>`;$('rs').onclick=()=>{go=0;kl=0;pl.mon=800;pl.arm=0;wp={id:'ak',...WPN.ak,am:30,rs:90,ls:0,rl:0,rc:0,sc:0};gVis();ov.style.display='none';newRnd();if(!MOB)ctl.lock()}}

function mmap(){
const c=mctx,W=120,H=120;c.fillStyle='rgba(22,22,16,.92)';c.fillRect(0,0,W,H);
const sc=.18,ox=W/2,oy=H/2;const p=MOB?cam.position:(ctl?.getObject()?.position||cam.position);
c.fillStyle='#c0392b';c.beginPath();c.arc(ox+sA.x*sc,oy-sA.z*sc,4.5,0,Math.PI*2);c.fill();
c.fillStyle='#3498db';c.beginPath();c.arc(ox+sB.x*sc,oy-sB.z*sc,4.5,0,Math.PI*2);c.fill();
en.forEach(b=>{c.fillStyle='#e74c3c';c.beginPath();c.arc(ox+b.mesh.position.x*sc,oy-b.mesh.position.z*sc,3,0,Math.PI*2);c.fill()});
al.forEach(b=>{c.fillStyle='#2ecc71';c.beginPath();c.arc(ox+b.mesh.position.x*sc,oy-b.mesh.position.z*sc,3,0,Math.PI*2);c.fill()});
c.fillStyle='#f1c40f';c.beginPath();c.arc(ox+p.x*sc,oy-p.z*sc,4,0,Math.PI*2);c.fill();
if(bm.p&&bm.m){c.fillStyle='#e67e22';c.fillRect(ox+bm.m.position.x*sc-2.5,oy-bm.m.position.z*sc-2.5,5,5)}
}

function hud(){hpf.style.width=Math.max(0,pl.hp)+'%';amo.textContent=`${wp.am} / ${wp.rs}`;kls.textContent=`Убийства: ${kl}`;wpn.textContent=wp.n;bs.style.display=(wp.sc&&MOB)?'flex':'none'}
function show(t,ms=1200){msg.textContent=t;msg.classList.add('on');setTimeout(()=>msg.classList.remove('on'),ms)}
function swW(id){if(!WPN[id])return;const w=WPN[id];if(pl.mon<w.pr&&id!==wp.id)return;if(id!==wp.id)pl.mon-=w.pr;wp={id,...w,am:w.mg,rs:w.rs,ls:0,rl:0,rc:0,sc:0};gVis();hud();mv.textContent=pl.mon;scp.classList.remove('on');cam.fov=72;cam.updateProjectionMatrix()}

function inp(){
addEventListener('keydown',e=>{ky[e.code]=1;if(e.code==='KeyR')reload();if(e.code==='Space')ky.jump=1;if(e.code==='KeyE'){pln=1;def=1}if(e.code==='KeyQ'&&wp.sc)tSc()});
addEventListener('keyup',e=>{ky[e.code]=0;if(e.code==='Space')ky.jump=0;if(e.code==='KeyE'){pln=0;def=0}});
if(!MOB){
document.addEventListener('mousedown',e=>{if(e.button===0&&gs&&!go&&ft<=0){if(!ctl.isLocked)ctl.lock();else fir=1}if(e.button===2&&wp.sc){e.preventDefault();tSc()}});
document.addEventListener('mouseup',e=>{if(e.button===0)fir=0});
document.addEventListener('contextmenu',e=>e.preventDefault());
ctl.addEventListener('lock',()=>{ov.style.display='none';gs=1});
ctl.addEventListener('unlock',()=>{if(!go){ov.style.display='flex';ov.querySelector('h1').textContent='ПАУЗА'}});
}
const cv=ren.domElement;
cv.addEventListener('touchstart',e=>{if(!gs||go)return;for(const t of e.changedTouches){if(t.clientX>innerWidth*.38){tl.a=1;tl.x=t.clientX;tl.y=t.clientY;tl.id=t.identifier}}}, {passive:1});
cv.addEventListener('touchmove',e=>{if(!tl.a)return;for(const t of e.changedTouches){if(t.identifier===tl.id){const dx=t.clientX-tl.x,dy=t.clientY-tl.y;cam.rotation.y-=dx*C.ts;cam.rotation.x-=dy*C.ts;cam.rotation.x=Math.max(-1.1,Math.min(1.1,cam.rotation.x));tl.x=t.clientX;tl.y=t.clientY}}}, {passive:1});
cv.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===tl.id)tl.a=0});
let ja=0,jid=null,jc={x:0,y:0};
function js(e){const t=e.changedTouches?e.changedTouches[0]:e;const r=jz.getBoundingClientRect();jc={x:r.left+r.width/2,y:r.top+r.height/2};ja=1;jid=t.identifier!==undefined?t.identifier:'m';jm(e)}
function jm(e){if(!ja)return;let t=e.changedTouches?Array.from(e.changedTouches).find(tt=>tt.identifier===jid):e;if(!t)return;const dx=t.clientX-jc.x,dy=t.clientY-jc.y;const mx=42,ln=Math.sqrt(dx*dx+dy*dy)||1,c=Math.min(ln,mx);jk.style.transform=`translate(${dx/ln*c}px,${dy/ln*c}px)`;md.x=dx/ln*c/mx;md.z=-(dy/ln*c)/mx}
function je(){ja=0;jk.style.transform='translate(0,0)';md.x=0;md.z=0}
jz.addEventListener('touchstart',js,{passive:0});jz.addEventListener('touchmove',jm,{passive:0});jz.addEventListener('touchend',je);jz.addEventListener('touchcancel',je);
const bd=(el,dn,up)=>{el.addEventListener('touchstart',e=>{e.preventDefault();el.classList.add('a');dn()},{passive:0});el.addEventListener('touchend',e=>{e.preventDefault();el.classList.remove('a');up()});el.addEventListener('touchcancel',()=>{el.classList.remove('a');up()})};
bd(bf,()=>fir=1,()=>fir=0);bd(bj,()=>ky.jump=1,()=>ky.jump=0);bd(br,()=>reload(),()=>{});bd(bp,()=>{pln=1;def=1},()=>{pln=0;def=0});bd(bs,()=>tSc(),()=>{});
document.querySelectorAll('.bb').forEach(b=>b.addEventListener('click',()=>{const w=b.dataset.w;if(w==='armor'){if(pl.mon>=650&&pl.arm<100){pl.mon-=650;pl.arm=100;mv.textContent=pl.mon}}else swW(w)}));
$('bc').addEventListener('click',()=>buy.style.display='none');
st.addEventListener('click',()=>{if(actx.state==='suspended')actx.resume();gs=1;ov.style.display='none';if(!MOB)ctl.lock();newRnd()});
}
function tSc(){if(!wp.sc)return;wp.sc=!wp.sc;if(wp.sc){scp.classList.add('on');cam.fov=25;cam.updateProjectionMatrix()}else{scp.classList.remove('on');cam.fov=72;cam.updateProjectionMatrix()}}

function loop(){
requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);
if(gs&&!go){updPl(dt);updBots(dt);updBomb(dt);updRnd(dt);mmap()}
if(gun&&gs){const t=performance.now()*.0014;gun.position.y=-.2+Math.sin(t)*.004;gun.position.x=.22+Math.cos(t*.5)*.002}
ren.render(sc,cam);
}
init();hud();
</script>
</body>
</html>
